# Exora: data engine + team app.
#
#   docker compose up -d --build
#   docker compose exec app prospector create-user --role admin      # first admin (prompts)
#   open http://127.0.0.1:8090
#
# Works with no .env at all: the session secret is generated on first start and kept on the data volume.
# Copy .env.example to .env to change anything (timezone, organisation name, API keys, Postgres, ...).
#
# The app owns its schema (create_all + additive column migration on startup), so a fresh volume needs no
# manual setup. SQLite is the default and is correct for one app instance on one machine; for several
# replicas switch PROSPECTOR_DATABASE_URL to Postgres (runs are then claimed with FOR UPDATE SKIP LOCKED).
name: exora

x-app: &app
  build: .
  image: exora:0.3.0
  restart: unless-stopped
  env_file:
    - path: .env
      required: false
  volumes:
    - exora-data:/app/data
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "5" }

services:
  app:
    <<: *app
    environment:
      # Workers + scheduler in this process (one machine). Set false and start the `worker` profile to split.
      PROSPECTOR_WORKER_ENABLED: ${PROSPECTOR_WORKER_ENABLED:-true}
      PROSPECTOR_SCHEDULER_ENABLED: ${PROSPECTOR_SCHEDULER_ENABLED:-true}
    # Loopback only by default. On a server, put a reverse proxy with HTTPS in front (Coolify does this),
    # set PROSPECTOR_COOKIE_SECURE=true, and only then consider EXORA_BIND=0.0.0.0.
    ports:
      - "${EXORA_BIND:-127.0.0.1}:${EXORA_PORT:-8090}:8090"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8090/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

  # Optional: run the data engine as its own service:
  #   PROSPECTOR_WORKER_ENABLED=false PROSPECTOR_SCHEDULER_ENABLED=false docker compose --profile worker up -d
  worker:
    <<: *app
    profiles: ["worker"]
    environment:
      PROSPECTOR_WORKER_ENABLED: "true"
      PROSPECTOR_SCHEDULER_ENABLED: "true"
    command: ["prospector", "worker"]

  # Optional: Cloudflare Tunnel as the only public route in (set CF_TUNNEL_TOKEN in .env):
  #   docker compose --profile tunnel up -d
  tunnel:
    image: cloudflare/cloudflared:2026.9.3
    profiles: ["tunnel"]
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CF_TUNNEL_TOKEN:-}
    depends_on:
      app:
        condition: service_healthy

volumes:
  exora-data:
