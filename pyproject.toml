[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "prospector"
version = "0.3.0"
description = "Exora: self-hosted B2B prospecting CRM - discover companies and people from public sources, verify, score and work them as a team."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Jahanzaib Ali", email = "hello@alilabsx.com" }]
# Exact pins, shared with the optional outreach engine where both use a package.
dependencies = [
    "python-dotenv==1.2.4",
    "fastapi==0.141.1",
    "uvicorn==0.54.0",
    "sqlalchemy==2.1.1",
    "pydantic==2.13.5",
    "pydantic-settings==2.15.0",
    "pyjwt==2.15.1",
    "typer==0.27.2",
    "httpx==0.28.1",
    "tzdata==2026.4",
    "tldextract==5.3.2",
    "phonenumbers==9.0.40",
    "dnspython==2.8.0",
    "email-validator==2.3.0",
    "rapidfuzz==3.14.6",
    "scrapy==2.19.0",
    "beautifulsoup4==4.15.0",
    "lxml==6.1.3",
    "openpyxl==3.1.5",
    "python-docx==1.2.0",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "ruff==0.16.9"]
# PROSPECTOR_DATABASE_URL=postgresql+psycopg://... for several app/worker replicas.
postgres = ["psycopg[binary]==3.3.6"]

[project.urls]
Homepage = "https://github.com/Jahanzaib211/exora"
Issues = "https://github.com/Jahanzaib211/exora/issues"

[project.scripts]
prospector = "prospector.cli:app"
exora = "prospector.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -p no:cacheprovider"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]
extend-exclude = ["web"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["B008"]
